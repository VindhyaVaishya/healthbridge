
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Login | HealthBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<section class="login-container">
    <div class="login-box">

        <div class="login-icon">🩺</div>

        <h2>Doctor Portal</h2>
        <p class="login-subtitle">
            Welcome back to HealthBridge
        </p>

        <div class="login-divider"></div>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/doctor-login">

            <label>Doctor ID</label>
            <input
                type="text"
                name="doctor_id"
                placeholder="Enter your Doctor ID"
                required>

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

            <button class="btn login-btn" type="submit">
                Login to Dashboard
            </button>

        </form>

        <p class="back-home">
            New Doctor?
            <a href="/doctor-register">Register here</a>
        </p>

        <p class="back-home">
            <a href="/">← Back to Home</a>
        </p>

        <p class="login-footer">
            HealthBridge · Your Health, Our Priority
        </p>

    </div>
</section>

</body>
</html>
