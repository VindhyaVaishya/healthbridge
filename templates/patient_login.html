
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | HealthBridge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<section class="login-container">
    <div class="login-box">

        <div class="login-icon">💛</div>

        <h2>Patient Portal</h2>
        <p class="login-subtitle">
            Your health journey starts here
        </p>

        <div class="login-divider"></div>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="/patient-login">

            <label>Patient ID or Mobile Number</label>
            <input
                type="text"
                name="login_id"
                placeholder="Enter Patient ID or Mobile"
                required>

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required>

            <button class="btn login-btn" type="submit">
                Login to Your Account
            </button>

        </form>

        <div class="register-section">
            <p>New to HealthBridge?</p>
            <a href="/patient-register">
                Register as a New Patient →
            </a>
        </div>

        <p class="back-home">
            <a href="/">← Back to Home</a>
        </p>

        <p class="login-footer">
            HealthBridge · Your Health, Our Priority
        </p>

    </div>
</section>

</body>
</html>
